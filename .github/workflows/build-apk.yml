
name: Build Ish Vaqtim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          if [ -f style.css ]; then cp style.css www/; fi

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Prepare app logo
        run: |
          npm install --no-save sharp @capacitor/assets
          mkdir -p assets
          node -e "require('sharp')('ish-vaqtim-icon.png').resize(1024,1024).png().toFile('assets/icon-only.png')"

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ish-Vaqtim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
