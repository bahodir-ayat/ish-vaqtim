
name: Build Ish Vaqtim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          if [ -f style.css ]; then cp style.css www/; 
        run: |
          npm install sharp
          mkdir -p resources
          node -e "require('sharp')('ish-vaqtim-icon.png').resize(1024,1024).png().toFile('resources/icon.png')"
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android



      - name: Install packages
        run: npm install
       
      - name: Generate Android app icon
        run: |
          mkdir -p assets
          npm install sharp
          node -e "require('sharp')('ish-vaqtim-icon.png').resize(1024,1024).png().toFile('assets/icon.png')"
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
 
        run: |
          npm install sharp
          mkdir -p resources
        node -e "require('sharp')('ish-vaqtim-icon.png').resize(1024,1024).png().toFile('assets/icon-only.png')"
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ish-Vaqtim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
